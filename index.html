<!DOCTYPE html>
<html lang="zh">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title data-i18n="title">
        图片合成视频
    </title>

    <link rel="stylesheet" href="style.css">
<!--    添加字体，避免高棉语可能乱码-->
    <link
 href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;700&display=swap"
 rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body>

    <!-- 左上角语言下拉框 -->
    <div class="language-box">

        <select id="languageSelect">

            <option value="zh">简体中文</option>

            <option value="zh-TW">繁体中文(台湾)</option>

            <option value="zh-HK">繁体中文(香港)</option>

            <option value="en">English</option>
<!--日语-->
            <option value="ja">日本語</option>
    <!--韩语-->
            <option value="ko">한국어</option>
<!--高棉语/柬埔寨语-->
             <option value="km">ខ្មែរ</option>
<!--缅甸语-->
             <option value="MM">မြန်မာစာ</option>
      <!--越南语-->
                 <option value="VN">Tiếng Việt</option>

        </select>

    </div>

    <div class="container">

        <h1 data-i18n="mainTitle">
            图片合成视频工具
        </h1>

        <div class="upload-box" id="uploadBox">

            <p data-i18n="dragText">
                拖拽图片到这里
            </p>

            <p data-i18n="orText">
                或者
            </p>

            <input type="file"
                   id="fileInput"
                   multiple
                   accept="image/*"
                   hidden>

            <button id="selectBtn"
                    data-i18n="selectBtn">

                选择图片

            </button>

        </div>

        <div id="imageList"></div>

        <div class="action-area">

            <button id="generateBtn"
                    data-i18n="generateBtn">

                开始合成视频

            </button>

            <button id="downloadBtn"
                    style="display:none;"
                    data-i18n="downloadBtn">

                下载视频

            </button>

        </div>

        <div id="status"></div>

    </div>

    <script src="i18n.js"></script>

    <script src="app.js"></script>

</body>

</html>
